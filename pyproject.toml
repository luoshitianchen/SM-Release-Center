[project]
name = "SM-Release-Center"
version = "2.0.0"
description = "软件发布中心：发布单、环境、部署记录、回滚与门禁"
requires-python = ">=3.11"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
